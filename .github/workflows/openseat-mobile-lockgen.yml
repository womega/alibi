name: OpenSeat mobile lock generator

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  lockgen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: tmp/openseat-mobile-lock-20260910

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"

      - name: Generate exact npm lock
        working-directory: .openseat-lockgen
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean install
        working-directory: .openseat-lockgen
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify Expo dependency health
        working-directory: .openseat-lockgen
        run: npx expo-doctor

      - name: Production audit
        working-directory: .openseat-lockgen
        run: npm audit --omit=dev --audit-level=moderate

      - name: Full audit
        working-directory: .openseat-lockgen
        run: npm audit --audit-level=moderate

      - name: Commit generated lock to scratch branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .openseat-lockgen/package-lock.json
          git diff --cached --quiet || git commit -m "Generate OpenSeat mobile lock"
          git push origin HEAD:tmp/openseat-mobile-lock-20260910

      - name: Upload generated lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openseat-mobile-package-lock
          path: .openseat-lockgen/package-lock.json
          if-no-files-found: error
          retention-days: 1
